<!doctype html><html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>ISDO Manager</title><link rel="stylesheet" href="/css/manager.css"></head><body>
<main class="wrap">
<section id="login" class="card auth"><p class="eyebrow">International Sharks Dodgeball Open</p><h1>Manager Portal</h1><p>Sign in with the email assigned to your club.</p>
<form id="loginForm"><label>Email<input id="email" type="email" required></label><label>Password<input id="password" type="password" required></label><button>Sign in</button></form>
<p id="loginMsg" class="msg hidden"></p></section>
<section id="dashboard" class="hidden"><header><div><p class="eyebrow">ISDO Manager Portal</p><h1 id="clubName">My Club</h1><p id="managerEmail"></p></div><button id="logout" class="secondary">Sign out</button></header>
<div class="stats"><div><span>Teams</span><strong id="teamCount">0</strong></div><div><span>Roster entries</span><strong id="rosterCount">0</strong></div><div><span>Complete</span><strong id="completeCount">0</strong></div><div><span>Meals missing</span><strong id="missingMealsCount">0</strong></div></div>
<div id="teams"></div></section>
<dialog id="dialog"><div class="dialog"><button id="closeDialog" class="close">×</button><p class="eyebrow" id="dCat"></p><h2 id="dName"></h2><p id="dTeam"></p><p><b>Jersey:</b> <span id="dJersey"></span></p><p><b>Registration:</b> <span id="dReg"></span></p><p><b>Meals:</b> <span id="dMeals"></span></p><button id="captainBtn">Set as captain</button><button id="viceBtn" class="secondary">Set as vice-captain</button><button id="removeBtn" class="danger">Remove from this roster</button></div></dialog>
</main>
<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script><script src="/js/supabase.js"></script><script src="/js/manager.js"></script></body></html>
