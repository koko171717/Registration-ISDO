<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width,initial-scale=1">
  <title>ISDO'27 Live Court</title>
  <link rel="stylesheet" href="/css/live-court.css">
</head>
<body>
  <main class="court-shell">
    <section id="matchView" class="match-board hidden">

      <div class="team-column" id="team1Card">
        <header class="team-header">
          <div class="team-brand">
            <img id="team1Logo" src="/assets/isdo27-logo.png" alt="Team A logo" class="team-logo">
            <div class="team-head-copy">
              <p class="team-eyebrow">International Sharks Dodgeball Open</p>
              <h2 id="team1Name">Team A</h2>
              <p id="team1Club" class="team-club">Club</p>
            </div>
          </div>
          <div class="team-category" id="team1Category">Category</div>
        </header>

        <div class="roster-wrap">
          <div id="team1Players" class="roster-body"></div>
        </div>

        <footer class="team-footer">
          <span>ISDO'27</span>
          <span>Morges · Switzerland</span>
        </footer>
      </div>

      <div class="team-column" id="team2Card">
        <header class="team-header">
          <div class="team-brand">
            <img id="team2Logo" src="/assets/isdo27-logo.png" alt="Team B logo" class="team-logo">
            <div class="team-head-copy">
              <p class="team-eyebrow">International Sharks Dodgeball Open</p>
              <h2 id="team2Name">Team B</h2>
              <p id="team2Club" class="team-club">Club</p>
            </div>
          </div>
          <div class="team-category" id="team2Category">Category</div>
        </header>

        <div class="roster-wrap">
          <div id="team2Players" class="roster-body"></div>
        </div>

        <footer class="team-footer">
          <span>ISDO'27</span>
          <span>Morges · Switzerland</span>
        </footer>
      </div>

    </section>
  </main>

  <script src="/js/live-court.js"></script>
</body>
</html>
